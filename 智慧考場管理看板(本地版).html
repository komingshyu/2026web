<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧考場管理看板 (終極穩定版) - By 阿剛老師</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                        hand: ['"Zen Maru Gothic"', 'sans-serif'],
                    },
                    colors: {
                        paper: '#fdfbf7',
                        ink: '#292524',
                        pencil: '#57534e',
                        highlight: '#f59e0b',
                        danger: '#ef4444',
                        success: '#10b981',
                        chalkboard: '#262626'
                    },
                    animation: {
                        'marquee': 'marquee 25s linear infinite',
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 0.3s ease-out',
                    },
                    keyframes: {
                        marquee: {
                            '0%': { transform: 'translateX(100vw)' },
                            '100%': { transform: 'translateX(-100%)' },
                        },
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'scale(0.95)' },
                            '100%': { opacity: '1', transform: 'scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #fdfbf7; color: #292524; overflow: hidden; }
        .hand-drawn-border {
            border: 3px solid #57534e;
            border-radius: 255px 15px 225px 15px / 15px 225px 15px 255px;
            box-shadow: 2px 4px 6px rgba(0,0,0,0.1);
        }
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // --- 內建圖示元件 (解決 DOM 衝突) ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const props = { width: size, height: size, className: `${className} inline-block stroke-current fill-none`, strokeWidth: "2", strokeLinecap: "round", strokeLinejoin: "round" };
            
            const icons = {
                'x': <svg {...props}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>,
                'trash-2': <svg {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>,
                'save': <svg {...props}><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>,
                'plus-circle': <svg {...props}><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg>,
            };

            return icons[name] || null;
        };

        // --- 錯誤邊界組件 ---
        class ErrorBoundary extends React.Component {
            constructor(props) {
                super(props);
                this.state = { hasError: false, error: null };
            }
            static getDerivedStateFromError(error) {
                return { hasError: true, error };
            }
            componentDidCatch(error, errorInfo) {
                console.error("ErrorBoundary caught an error", error, errorInfo);
            }
            render() {
                if (this.state.hasError) {
                    return (
                        <div className="flex items-center justify-center h-screen bg-red-50 text-red-800 p-10 flex-col text-center">
                            <h1 className="text-3xl font-bold mb-4">系統發生錯誤</h1>
                            <p className="mb-4">很抱歉，畫面渲染過程中發生了預期外的錯誤。</p>
                            <button 
                                onClick={() => window.location.reload()} 
                                className="mt-6 px-6 py-2 bg-red-600 text-white rounded hover:bg-red-700 font-bold"
                            >
                                重新整理頁面
                            </button>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        // --- 本地預設資料 ---
        const DEFAULT_SCHEDULE = [
            { id: 1, '日期': new Date().toISOString().split('T')[0], '節次': '第一節', '科目': '國語文', '開始時間': '08:20', '結束時間': '09:40', '備註': '請備妥2B鉛筆' },
            { id: 2, '日期': new Date().toISOString().split('T')[0], '節次': '第二節', '科目': '數學', '開始時間': '10:20', '結束時間': '11:50', '備註': '可使用計算機(依規定)' },
            { id: 3, '日期': new Date().toISOString().split('T')[0], '節次': '第三節', '科目': '公民', '開始時間': '13:20', '結束時間': '14:50', '備註': '' }
        ];

        const DEFAULT_MESSAGES = [
            { id: 1, '顯示內容': '保持冷靜，細心檢查', '啟用狀態': true },
            { id: 2, '顯示內容': '手機請關機並放入書包', '啟用狀態': true },
            { id: 3, '顯示內容': '考試結束鐘響前，不得提早交卷', '啟用狀態': true },
            { id: 4, '顯示內容': '作弊將以零分計算', '啟用狀態': false }
        ];

        const STORAGE_KEYS = {
            SCHEDULE: 'exam_local_schedule',
            MESSAGES: 'exam_local_messages',
            CONFIG: 'exam_local_config' 
        };

        const formatTime = (date) => {
            if (!(date instanceof Date) || isNaN(date)) return "00:00:00";
            return date.toLocaleTimeString('zh-TW', { hour12: false });
        };
        
        const toDateInputValue = (date) => {
            return date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
        };

        const safeCheckIsPast = (currentTime, item) => {
            try {
                if (!item || !item['日期'] || !item['結束時間']) return false;
                let dateStr = String(item['日期']).trim();
                if (!dateStr) return false;
                dateStr = dateStr.replace(/\//g, '-');
                if (!dateStr.includes('-')) return false;
                
                const parts = dateStr.split('-');
                if (parts.length !== 3) return false;
                const [y, m, d] = parts.map(Number);
                if (isNaN(y) || isNaN(m) || isNaN(d)) return false;

                const timeStr = String(item['結束時間']).trim();
                if (!timeStr || !timeStr.includes(':')) return false;
                const timeParts = timeStr.split(':').map(Number);
                if (timeParts.length < 2) return false;
                const [eh, em] = timeParts;
                if (isNaN(eh) || isNaN(em)) return false;

                const end = new Date(y, m - 1, d, eh, em, 0);
                if (isNaN(end.getTime())) return false;
                return currentTime > end;
            } catch (e) {
                console.warn("Date parsing error", e);
                return false;
            }
        };

        const useClock = () => {
            const [time, setTime] = useState(new Date());
            useEffect(() => {
                const timer = setInterval(() => setTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);
            return time;
        };

        const Modal = ({ isOpen, title, children, onClose, type = 'info', maxWidth = 'max-w-2xl' }) => {
            if (!isOpen) return null;
            const colors = {
                info: 'border-pencil',
                warning: 'border-highlight',
                danger: 'border-danger'
            };
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm p-4">
                    <div className={`bg-paper w-full ${maxWidth} p-6 relative hand-drawn-border ${colors[type]} shadow-2xl animate-fade-in flex flex-col max-h-[90vh]`}>
                        <div className="flex justify-between items-center mb-4 border-b-2 border-dashed border-gray-300 pb-2 flex-shrink-0">
                            <h2 className="text-2xl font-bold font-hand text-ink">{title}</h2>
                            <button onClick={onClose} className="p-2 hover:bg-gray-200 rounded-full transition">
                                <Icon name="x" size={24} />
                            </button>
                        </div>
                        <div className="overflow-y-auto custom-scrollbar flex-1 pr-2">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const currentTime = useClock();

            const [config, setConfig] = useState(() => {
                try {
                    const savedConfig = localStorage.getItem(STORAGE_KEYS.CONFIG);
                    return savedConfig ? JSON.parse(savedConfig) : { marqueeSpeed: 25 };
                } catch (e) { return { marqueeSpeed: 25 }; }
            });

            const [schedule, setSchedule] = useState(DEFAULT_SCHEDULE);
            const [rawMessages, setRawMessages] = useState(DEFAULT_MESSAGES);
            const [selectedDate, setSelectedDate] = useState(toDateInputValue(new Date()));
            
            const [adminTab, setAdminTab] = useState('schedule');
            const [tempSchedule, setTempSchedule] = useState([]);
            const [tempMessages, setTempMessages] = useState([]);
            const [isSaving, setIsSaving] = useState(false);

            const [modals, setModals] = useState({ help: false, admin: false, custom: null });
            const [theme, setTheme] = useState('light');

            // 初始化資料
            useEffect(() => {
                const loadData = () => {
                    try {
                        const savedSchedule = localStorage.getItem(STORAGE_KEYS.SCHEDULE);
                        const savedMessages = localStorage.getItem(STORAGE_KEYS.MESSAGES);
                        if (savedSchedule) setSchedule(JSON.parse(savedSchedule));
                        if (savedMessages) setRawMessages(JSON.parse(savedMessages));
                    } catch (e) { console.error("Load data failed", e); }
                };
                loadData();
            }, []);

            // 管理 Modal 開啟時的資料同步
            const prevAdminOpen = useRef(false);
            useEffect(() => {
                if (modals.admin && !prevAdminOpen.current) {
                    setTempSchedule(JSON.parse(JSON.stringify(schedule)));
                    setTempMessages(JSON.parse(JSON.stringify(rawMessages)));
                }
                prevAdminOpen.current = modals.admin;
            }, [modals.admin, schedule, rawMessages]);

            const saveData = async (type) => {
                setIsSaving(true);
                try {
                    await new Promise(resolve => setTimeout(resolve, 300));
                    
                    if (type === 'schedule') {
                        localStorage.setItem(STORAGE_KEYS.SCHEDULE, JSON.stringify(tempSchedule));
                        setSchedule(JSON.parse(JSON.stringify(tempSchedule)));
                    } else if (type === 'messages') {
                        localStorage.setItem(STORAGE_KEYS.MESSAGES, JSON.stringify(tempMessages));
                        setRawMessages(JSON.parse(JSON.stringify(tempMessages)));
                    }
                    showCustomModal('儲存成功', '資料已更新。', 'success');
                } catch (error) {
                    showCustomModal('儲存失敗', error.toString(), 'danger');
                } finally {
                    setIsSaving(false);
                }
            };

            const updateConfig = (newConfig) => {
                const updated = { ...config, ...newConfig };
                setConfig(updated);
                localStorage.setItem(STORAGE_KEYS.CONFIG, JSON.stringify(updated));
            };

            const handleScheduleChange = (id, field, value) => {
                const newSchedule = tempSchedule.map(item => 
                    item.id === id ? { ...item, [field]: value } : item
                );
                setTempSchedule(newSchedule);
            };

            const addScheduleItem = () => {
                const today = new Date().toISOString().split('T')[0];
                const newId = tempSchedule.length > 0 ? Math.max(...tempSchedule.map(s => s.id || 0)) + 1 : 1;
                setTempSchedule([...tempSchedule, {
                    id: newId,
                    '日期': today,
                    '節次': '',
                    '科目': '',
                    '開始時間': '00:00',
                    '結束時間': '00:00',
                    '備註': ''
                }]);
            };

            const removeScheduleItem = (id) => {
                if(confirm("確定要刪除此考程嗎？")) {
                    const newSchedule = tempSchedule.filter(item => item.id !== id);
                    setTempSchedule(newSchedule);
                }
            };

            const handleMessageChange = (id, field, value) => {
                const newMessages = tempMessages.map(msg => 
                    msg.id === id ? { ...msg, [field]: value } : msg
                );
                setTempMessages(newMessages);
            };

            const addMessageItem = () => {
                const newId = tempMessages.length > 0 ? Math.max(...tempMessages.map(m => m.id || 0)) + 1 : 1;
                setTempMessages([...tempMessages, { id: newId, '顯示內容': '', '啟用狀態': true }]);
            };

            const removeMessageItem = (id) => {
                if(confirm("確定要刪除此語錄嗎？")) {
                    const newMessages = tempMessages.filter(msg => msg.id !== id);
                    setTempMessages(newMessages);
                }
            };

            const currentStatus = useMemo(() => {
                try {
                    if (!schedule.length) return { status: 'idle', subject: '暫無考試', progress: 0, text: '本日無安排' };
                    
                    const now = currentTime;
                    const dateStr = now.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '-');
                    
                    const todaySchedule = schedule.filter(s => {
                       if (!s || !s['日期']) return false;
                       const sDate = String(s['日期']).replace(/\//g, '-');
                       return sDate === dateStr;
                    });

                    const targetSchedule = todaySchedule.length > 0 ? todaySchedule : schedule;

                    for (let i = 0; i < targetSchedule.length; i++) {
                        const exam = targetSchedule[i];
                        if (!exam || !exam['開始時間'] || !exam['結束時間']) continue;
                        
                        const sTimeParts = String(exam['開始時間']).split(':').map(Number);
                        const eTimeParts = String(exam['結束時間']).split(':').map(Number);
                        
                        if (sTimeParts.length < 2 || eTimeParts.length < 2) continue;
                        if (sTimeParts.some(isNaN) || eTimeParts.some(isNaN)) continue;

                        const [sh, sm] = sTimeParts;
                        const [eh, em] = eTimeParts;
                        
                        const start = new Date(now); start.setHours(sh, sm, 0);
                        const end = new Date(now); end.setHours(eh, em, 0);

                        if (isNaN(start.getTime()) || isNaN(end.getTime())) continue;

                        if (now >= start && now <= end) {
                            const total = (end - start);
                            const elapsed = (now - start);
                            const progress = total > 0 ? Math.min((elapsed / total) * 100, 100) : 0;
                            const remaining = Math.floor((end - now) / 1000 / 60);
                            
                            return {
                                status: 'examining',
                                subject: exam['科目'],
                                section: exam['節次'],
                                progress: progress,
                                remaining: remaining,
                                warning: remaining <= 10,
                                endTime: exam['結束時間'],
                                obj: exam
                            };
                        } else if (now < start) {
                             let prevEnd = new Date(0);
                             if (i > 0 && targetSchedule[i-1] && targetSchedule[i-1]['結束時間']) {
                                const prevParts = String(targetSchedule[i-1]['結束時間']).split(':').map(Number);
                                if (prevParts.length >= 2) {
                                    prevEnd = new Date(now);
                                    prevEnd.setHours(prevParts[0], prevParts[1], 0);
                                }
                             }

                             if (i === 0 || now > prevEnd) {
                                 const waitMins = Math.floor((start - now) / 1000 / 60);
                                 if (waitMins < 60) {
                                    return { status: 'waiting', subject: exam['科目'], nextStart: exam['開始時間'], minsToStart: waitMins, obj: exam };
                                 }
                             }
                        }
                    }
                    return { status: 'idle', subject: '目前無考試', progress: 0 };
                } catch (e) {
                    console.error("Status calculation error", e);
                    return { status: 'error', subject: '資料解析錯誤', progress: 0 };
                }
            }, [currentTime, schedule]);
            
            const filteredSchedule = useMemo(() => {
                if (!selectedDate) return [];
                return schedule.filter(s => {
                    if (!s || !s['日期']) return false;
                    const sDate = String(s['日期']).replace(/\//g, '-');
                    return sDate === selectedDate;
                });
            }, [schedule, selectedDate]);

            const showCustomModal = (title, message, type='info') => {
                setModals(prev => ({ ...prev, custom: { title, message, type } }));
            };

            const toggleTheme = () => {
                setTheme(prev => prev === 'light' ? 'dark' : 'light');
            };

            const marqueeText = useMemo(() => {
                const activeMsgs = rawMessages
                    .filter(m => m['啟用狀態'] === true || m['啟用狀態'] === 'TRUE')
                    .map(m => m['顯示內容']);
                
                if (activeMsgs.length === 0) return "歡迎使用考場管理系統，請至後台設定語錄。";
                const combined = activeMsgs.join("　★　");
                return (combined + "　★　").repeat(5);
            }, [rawMessages]);

            const containerClass = theme === 'dark' ? 'bg-chalkboard text-gray-100' : 'bg-paper text-ink';
            const cardClass = theme === 'dark' ? 'bg-zinc-800 border-zinc-600' : 'bg-white border-pencil';
            const inputClass = "w-full p-2 border border-gray-300 rounded focus:border-highlight outline-none text-sm bg-white";

            return (
                <div className={`w-screen h-screen flex flex-col p-4 ${containerClass} transition-colors duration-500 font-sans`}>
                    {/* Header */}
                    <header className="flex justify-between items-center mb-4 px-4">
                        <div className="flex items-center gap-4">
                            <h1 className="text-3xl font-bold font-hand tracking-widest">
                                🏫 考場資訊看板
                            </h1>
                            <span className="text-xl opacity-70">
                                {currentTime.toLocaleDateString('zh-TW', {weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'})}
                            </span>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={toggleTheme} className="p-3 rounded-full hover:bg-black/10 transition" title="切換模式">
                                {theme === 'light' ? '🌞' : '🌙'}
                            </button>
                            <button onClick={() => setModals(p => ({...p, admin: true}))} className="p-3 rounded-full hover:bg-black/10 transition" title="考程管理">
                                📝
                            </button>
                            <button onClick={() => setModals(p => ({...p, help: true}))} className="p-3 rounded-full hover:bg-black/10 transition" title="說明">
                                ℹ️
                            </button>
                        </div>
                    </header>

                    {/* Main Content Grid */}
                    <main className="flex-1 grid grid-cols-12 gap-6 overflow-hidden">
                        {/* 左側：時鐘與狀態 (7/12) */}
                        <div className="col-span-12 lg:col-span-7 flex flex-col gap-6">
                            {/* 大時鐘 */}
                            <div className={`flex-1 flex flex-col items-center justify-center hand-drawn-border ${cardClass} relative overflow-hidden`}>
                                <div className="text-[12vw] leading-none font-bold tabular-nums tracking-tighter text-center">
                                    {formatTime(currentTime)}
                                </div>
                                <div className="text-4xl mt-4 font-hand opacity-60">現在時間</div>
                                {currentStatus.status === 'examining' && (
                                    <div className="absolute top-4 right-4 bg-red-100 text-red-600 px-6 py-2 rounded-full font-bold text-2xl animate-pulse">
                                        剩下 {currentStatus.remaining} 分鐘
                                    </div>
                                )}
                            </div>

                            {/* 考試進度條區塊 */}
                            <div className={`h-48 p-6 hand-drawn-border ${cardClass} flex flex-col justify-center`}>
                                {currentStatus.status === 'examining' ? (
                                    <>
                                        <div className="flex justify-between items-end mb-4">
                                            <div>
                                                <span className="text-2xl font-bold bg-highlight text-white px-3 py-1 rounded mr-3">進行中</span>
                                                <span className="text-5xl font-bold">{currentStatus.subject}</span>
                                            </div>
                                            <div className="text-3xl font-bold opacity-50">
                                                {currentStatus.endTime} 結束
                                            </div>
                                        </div>
                                        <div className="w-full h-8 bg-gray-200 rounded-full overflow-hidden border-2 border-gray-400">
                                            <div 
                                                className={`h-full transition-all duration-1000 ease-linear ${currentStatus.warning ? 'bg-danger animate-pulse' : 'bg-blue-500'}`}
                                                style={{ width: `${currentStatus.progress}%` }}
                                            ></div>
                                        </div>
                                        {currentStatus.warning && (
                                            <div className="mt-2 text-center text-danger font-bold text-xl animate-bounce">
                                                ⚠️ 請檢查每一題是否都有作答
                                            </div>
                                        )}
                                    </>
                                ) : (
                                    <div className="flex flex-col items-center justify-center h-full text-center">
                                        <h2 className="text-4xl font-bold opacity-40 mb-2">
                                            {currentStatus.status === 'waiting' ? `下節預告：${currentStatus.subject}` : '目前無考試'}
                                        </h2>
                                        {currentStatus.status === 'waiting' && (
                                            <p className="text-2xl text-highlight">
                                                {currentStatus.nextStart} 開始 (還有 {currentStatus.minsToStart} 分鐘)
                                            </p>
                                        )}
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* 右側：考程表 (5/12) */}
                        <div className={`col-span-12 lg:col-span-5 hand-drawn-border ${cardClass} p-6 overflow-hidden flex flex-col`}>
                            <div className="flex justify-between items-center mb-6 border-b-2 border-dashed border-gray-300 pb-2">
                                <h2 className="text-3xl font-bold text-center">
                                    📅 考程表
                                </h2>
                                <input
                                    type="date"
                                    className={`p-1 border border-gray-300 rounded text-lg bg-transparent ${theme === 'dark' ? 'text-white' : 'text-ink'}`}
                                    value={selectedDate}
                                    onChange={(e) => setSelectedDate(e.target.value)}
                                />
                            </div>
                            <div className="flex-1 overflow-y-auto pr-2 space-y-4 custom-scrollbar">
                                {filteredSchedule.length === 0 ? (
                                    <div className="text-center opacity-50 text-xl mt-10">
                                        {schedule.length === 0 ? "無考程資料..." : "此日期無考試安排"}
                                    </div>
                                ) : (
                                    filteredSchedule.map((item) => {
                                        const isCurrent = currentStatus.obj && currentStatus.obj.id === item.id;
                                        const isPast = safeCheckIsPast(currentTime, item);

                                        return (
                                            <div key={item.id} className={`
                                                flex justify-between items-center p-4 rounded-xl border-2 transition-all
                                                ${isCurrent ? 'bg-highlight/20 border-highlight scale-105 shadow-lg' : isPast ? 'bg-gray-100 border-gray-200 opacity-60' : 'bg-transparent border-dashed border-gray-300'}
                                            `}>
                                                <div className="flex items-center gap-4">
                                                    <div className={`w-12 h-12 rounded-full flex items-center justify-center font-bold text-lg ${isCurrent ? 'bg-highlight text-white' : 'bg-gray-200'}`}>
                                                        {item['節次'] ? item['節次'].substring(0,2) : ''}
                                                    </div>
                                                    <div>
                                                        <div className="text-2xl font-bold">{item['科目']}</div>
                                                        <div className="text-sm opacity-70">{item['備註']}</div>
                                                    </div>
                                                </div>
                                                <div className="text-xl font-mono font-bold">
                                                    {item['開始時間']} - {item['結束時間']}
                                                </div>
                                            </div>
                                        )
                                    })
                                )}
                            </div>
                        </div>
                    </main>

                    {/* 底部：跑馬燈 */}
                    <footer className="mt-6 h-16 bg-gradient-to-r from-stone-800 to-stone-700 rounded-full flex items-center overflow-hidden border-4 border-stone-600 shadow-xl relative text-white">
                        <div className="absolute left-0 bg-stone-800 px-4 z-10 font-bold tracking-widest h-full flex items-center border-r border-stone-600">
                            📢 公告
                        </div>
                        <div 
                            className="whitespace-nowrap animate-marquee text-3xl font-bold ml-4"
                            style={{ animationDuration: `${config.marqueeSpeed}s` }}
                        >
                            {marqueeText}
                        </div>
                        <div className="absolute right-0 bg-stone-800 px-4 z-10 text-xs h-full flex items-center border-l border-stone-600 opacity-50">
                            本地資料版 | Made by 阿剛老師
                        </div>
                    </footer>

                    {/* Modals */}
                    <Modal isOpen={modals.help} title="關於此系統 (本地版)" onClose={() => setModals(p => ({...p, help: false}))}>
                        <div className="space-y-4">
                            <p className="text-gray-600">
                                此版本為「本地資料版」，所有考程與語錄資料均儲存於您的瀏覽器中。
                                不需要連接網路或設定 Google Script，適合單機展示使用。
                            </p>
                            <div className="bg-blue-50 p-4 rounded border border-blue-100">
                                <h3 className="font-bold text-blue-800 mb-2">⚠️ 注意事項</h3>
                                <ul className="list-disc list-inside text-sm text-blue-700 space-y-1">
                                    <li>如果清除瀏覽器快取，資料將會遺失。</li>
                                    <li>資料僅存在於目前使用的瀏覽器中，無法跨設備同步。</li>
                                </ul>
                            </div>
                            <div>
                                <label className="block text-sm font-bold mb-2">公告捲動速度 (秒)</label>
                                <div className="flex items-center gap-4">
                                    <input 
                                        type="range" 
                                        min="10" 
                                        max="180" 
                                        className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer"
                                        value={config.marqueeSpeed}
                                        onChange={(e) => updateConfig({ marqueeSpeed: parseInt(e.target.value) })}
                                    />
                                    <span className="font-mono font-bold w-12 text-right">{config.marqueeSpeed}s</span>
                                </div>
                            </div>
                        </div>
                    </Modal>

                    {/* Admin Modal */}
                    <Modal isOpen={modals.admin} title="後台管理介面" onClose={() => setModals(p => ({...p, admin: false}))} maxWidth="max-w-4xl">
                        <div className="flex flex-col h-full">
                            <div className="flex gap-2 mb-4 border-b border-gray-300 pb-2">
                                <button 
                                    className={`px-4 py-2 rounded-t-lg font-bold ${adminTab === 'schedule' ? 'bg-highlight text-white' : 'bg-gray-100 text-gray-600'}`}
                                    onClick={() => setAdminTab('schedule')}
                                >
                                    考程設定
                                </button>
                                <button 
                                    className={`px-4 py-2 rounded-t-lg font-bold ${adminTab === 'messages' ? 'bg-highlight text-white' : 'bg-gray-100 text-gray-600'}`}
                                    onClick={() => setAdminTab('messages')}
                                >
                                    語錄/公告設定
                                </button>
                            </div>

                            {adminTab === 'schedule' && (
                                <div className="flex-1 flex flex-col gap-4">
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-sm text-left">
                                            <thead className="bg-gray-100 font-bold text-gray-700">
                                                <tr>
                                                    <th className="p-2 w-32">日期</th>
                                                    <th className="p-2 w-20">節次</th>
                                                    <th className="p-2 w-32">科目</th>
                                                    <th className="p-2 w-24">開始</th>
                                                    <th className="p-2 w-24">結束</th>
                                                    <th className="p-2">備註</th>
                                                    <th className="p-2 w-12"></th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-gray-200">
                                                {tempSchedule.map((item) => (
                                                    <tr key={item.id} className="hover:bg-gray-50">
                                                        <td className="p-1"><input type="date" className={inputClass} value={item['日期']} onChange={e => handleScheduleChange(item.id, '日期', e.target.value)} /></td>
                                                        <td className="p-1"><input type="text" className={inputClass} value={item['節次']} onChange={e => handleScheduleChange(item.id, '節次', e.target.value)} /></td>
                                                        <td className="p-1"><input type="text" className={inputClass} value={item['科目']} onChange={e => handleScheduleChange(item.id, '科目', e.target.value)} /></td>
                                                        <td className="p-1"><input type="time" className={inputClass} value={item['開始時間']} onChange={e => handleScheduleChange(item.id, '開始時間', e.target.value)} /></td>
                                                        <td className="p-1"><input type="time" className={inputClass} value={item['結束時間']} onChange={e => handleScheduleChange(item.id, '結束時間', e.target.value)} /></td>
                                                        <td className="p-1"><input type="text" className={inputClass} value={item['備註']} onChange={e => handleScheduleChange(item.id, '備註', e.target.value)} /></td>
                                                        <td className="p-1 text-center">
                                                            <button onClick={() => removeScheduleItem(item.id)} className="text-danger hover:bg-red-100 p-1 rounded">
                                                                <Icon name="trash-2" size={16} />
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="flex justify-between items-center mt-2">
                                        <button onClick={addScheduleItem} className="flex items-center gap-2 text-highlight hover:bg-yellow-50 px-3 py-1 rounded">
                                            <Icon name="plus-circle" size={16} /> 新增一列
                                        </button>
                                        <button 
                                            onClick={() => saveData('schedule')} 
                                            disabled={isSaving}
                                            className="bg-highlight text-white px-6 py-2 rounded font-bold hover:bg-yellow-600 disabled:opacity-50 flex items-center gap-2"
                                        >
                                            {isSaving ? '儲存中...' : <><Icon name="save" size={16} /> 儲存變更</>}
                                        </button>
                                    </div>
                                </div>
                            )}

                            {adminTab === 'messages' && (
                                <div className="flex-1 flex flex-col gap-4">
                                    <div className="space-y-2">
                                        {tempMessages.map((msg) => (
                                            <div key={msg.id} className="flex items-center gap-2 p-2 border border-gray-200 rounded hover:bg-gray-50 bg-white">
                                                <div className="flex-1">
                                                    <input 
                                                        type="text" 
                                                        className={inputClass} 
                                                        value={msg['顯示內容']} 
                                                        onChange={e => handleMessageChange(msg.id, '顯示內容', e.target.value)}
                                                        placeholder="請輸入鼓勵語或規則..."
                                                    />
                                                </div>
                                                <div className="flex items-center gap-2 px-2">
                                                    <label className="flex items-center cursor-pointer">
                                                        <input 
                                                            type="checkbox" 
                                                            className="sr-only peer"
                                                            checked={msg['啟用狀態'] === true || msg['啟用狀態'] === 'TRUE'}
                                                            onChange={e => handleMessageChange(msg.id, '啟用狀態', e.target.checked)}
                                                        />
                                                        <div className="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-success relative"></div>
                                                        <span className="ml-2 text-sm text-gray-600 w-12">{msg['啟用狀態'] ? '啟用' : '停用'}</span>
                                                    </label>
                                                </div>
                                                <button onClick={() => removeMessageItem(msg.id)} className="text-danger hover:bg-red-100 p-2 rounded">
                                                    <Icon name="trash-2" size={16} />
                                                </button>
                                            </div>
                                        ))}
                                    </div>
                                    <div className="flex justify-between items-center mt-2">
                                        <button onClick={addMessageItem} className="flex items-center gap-2 text-highlight hover:bg-yellow-50 px-3 py-1 rounded">
                                            <Icon name="plus-circle" size={16} /> 新增語錄
                                        </button>
                                        <button 
                                            onClick={() => saveData('messages')} 
                                            disabled={isSaving}
                                            className="bg-highlight text-white px-6 py-2 rounded font-bold hover:bg-yellow-600 disabled:opacity-50 flex items-center gap-2"
                                        >
                                            {isSaving ? '儲存中...' : <><Icon name="save" size={16} /> 儲存變更</>}
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </Modal>

                    {/* Custom Alert Modal */}
                    {modals.custom && (
                        <Modal 
                            isOpen={true} 
                            title={modals.custom.title} 
                            type={modals.custom.type}
                            onClose={() => setModals(p => ({...p, custom: null}))}
                        >
                            <div className="text-center py-4">
                                <p className="text-lg mb-6">{modals.custom.message}</p>
                                <button 
                                    onClick={() => setModals(p => ({...p, custom: null}))}
                                    className="bg-stone-600 text-white px-8 py-2 rounded hover:bg-stone-800"
                                >
                                    確定
                                </button>
                            </div>
                        </Modal>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ErrorBoundary>
                <App />
            </ErrorBoundary>
        );
    </script>
</body>
</html>
